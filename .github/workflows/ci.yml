# The three commands the README documents, run on both OSes the project claims to
# support. Nothing here is Chaperone-specific cleverness on purpose: if the README
# says these three pass on Windows and Linux, CI is what keeps that sentence true.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Deliberately NOT setting RUSTFLAGS here, tempting as `-D warnings` is: the
  # RUSTFLAGS environment variable REPLACES `target.*.rustflags` from
  # .cargo/config.toml rather than adding to it, which would silently drop
  # `+crt-static` on Windows (D-032) and make CI build something other than what
  # we ship. The clippy step below already fails on warnings.

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Both platforms report. A Windows failure must not hide a Linux one —
      # the SMB and POSIX backends fail in genuinely different places.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  msrv:
    # Builds with exactly the toolchain Cargo.toml declares, read FROM Cargo.toml
    # rather than pinned here. Hardcoding it created a second place for the number
    # to live, and the two promptly disagreed: the job pinned 1.85.0 while the
    # locked graph had moved to needing 1.88. Now a bump in one place is a bump in
    # both, and a dependency update that raises the real floor fails here — which
    # is the whole point, since a reader provisioning a box from the README is the
    # person who otherwise discovers it.
    name: MSRV (as declared)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read rust-version from Cargo.toml
        id: msrv
        shell: bash
        run: |
          set -euo pipefail
          v=$(sed -n 's/^rust-version = "\([^"]*\)".*/\1/p' Cargo.toml | head -1)
          if [ -z "$v" ]; then echo "::error::no rust-version in [workspace.package]"; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Declared MSRV: $v"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2

      - name: Build with the declared minimum toolchain
        run: cargo build --workspace --all-targets
