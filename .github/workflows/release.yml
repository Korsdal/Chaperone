# Cut a release: push a `v*` tag, get built binaries and packed .mcpb bundles
# attached to a DRAFT GitHub Release for a human to review and publish.
#
# Anyone who clones this repo can build it themselves — `cargo build --release`
# is three words. Publishing binaries is not about capability, it is about not
# making a DBA install a Rust toolchain on a fileserver to try the thing.
#
# Deliberately absent: RUSTFLAGS. The env var REPLACES `target.*.rustflags` from
# .cargo/config.toml, which would drop `+crt-static` (D-032) and ship binaries
# that need the Visual C++ redistributable — the exact failure that cost hours at
# the first customer install.
name: Release

on:
  push:
    tags: ["v*"]
  # Dry run: builds and packs everything, uploads it as workflow artifacts, and
  # creates no release. Use it to prove the pipeline before spending a tag.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version-gate:
    name: Tag matches workspace version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: v
        shell: bash
        run: |
          set -euo pipefail
          workspace=$(sed -n 's/^version = "\([^"]*\)".*/\1/p' Cargo.toml | head -1)
          if [ -z "$workspace" ]; then echo "::error::could not read version from Cargo.toml"; exit 1; fi

          # New constraint, and it belongs here rather than 10 minutes downstream:
          # the Windows package is an MSI, and MSI's ProductVersion accepts only
          # numeric `x.y.z(.b)`. A perfectly reasonable `0.2.0-rc1` would build,
          # test and pack on three runners and then fail inside `wix build`.
          case "$workspace" in
            *[!0-9.]*|*..*|.*|*.)
              echo "::error::version \"$workspace\" is not numeric x.y.z."
              echo "::error::The Windows coordinator ships as an MSI, and MSI product versions"
              echo "::error::cannot carry a pre-release suffix. Pick a numeric version."
              exit 1 ;;
          esac

          echo "version=$workspace" >> "$GITHUB_OUTPUT"

          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "Dry run for $workspace — every stage runs except the publish itself."
            exit 0
          fi

          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$workspace" ]; then
            echo "::error::tag v$tag does not match workspace version $workspace."
            echo "::error::Bump [workspace.package] version in Cargo.toml first, commit it, then tag."
            echo "::error::Versioning is a human responsibility in this project — CI will not paper over the mismatch."
            exit 1
          fi
          echo "Tag v$tag matches workspace version $workspace."

  build:
    name: ${{ matrix.slug }}
    needs: version-gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `coord` says how this platform ships a coordinator, and it is the
          # only axis the three legs actually differ on:
          #   msi     — the MSI, and NOT the bare executable. On Windows the
          #             installer is the delivery, and shipping both invites the
          #             question of which one is meant.
          #   binary  — the bare executable, which on Linux *is* the installer
          #             (D-032): a bare invocation runs the setup wizard.
          #   none    — no coordinator at all. Nobody runs a macOS coordinator in
          #             front of a fileserver and nothing tests one, so publishing
          #             it would be an artifact whose only claim is that it
          #             compiled.
          - os: windows-latest
            platform: win32
            slug: windows-x86_64
            exe: ".exe"
            coord: msi
          - os: ubuntu-latest
            platform: linux
            slug: linux-x86_64
            exe: ""
            coord: binary
          # Exercised on the POSIX path since 2026-08-21 (I-012): CI now runs the
          # unit suite and the end-to-end job on macos-latest, so this is no longer
          # a build-only artifact. Nothing in the endpoint is Linux-specific — no
          # `cfg(target_os)`, `cfg(unix)` or `libc` use anywhere in it — so the
          # split is Windows vs not-Windows and macOS takes the same POSIX path.
          #
          # The remaining gap, stated because a green artifact must not imply more
          # than it proves: POSIX uses **advisory** `flock`, so nothing here covers
          # a Mac driving an SMB share, which is the realistic Mac deployment.
          - os: macos-latest
            platform: darwin
            slug: macos-arm64
            exe: ""
            coord: none
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # For `npx @anthropic-ai/mcpb` in the packing step.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # A release build that has not passed its own tests is not a release. This
      # duplicates CI on purpose: a tag can be pushed at a commit CI never saw.
      - name: Test
        run: cargo test --workspace

      - name: Build release binaries
        run: cargo build --release --workspace

      - name: Prepare dist
        shell: bash
        run: mkdir -p dist

      # One bundle per client OS, built ON that OS — build-mcpb.ps1 refuses to
      # label a binary as a platform it was not compiled for.
      - name: Pack the endpoint MCPB
        shell: pwsh
        run: |
          ./packaging/mcpb/build-mcpb.ps1 `
            -Template ./packaging/mcpb/manifest.template.json `
            -Version ${{ needs.version-gate.outputs.version }} `
            -Platform ${{ matrix.platform }} `
            -OutDir ./build/bundle `
            -Output ./dist/chaperone-endpoint-${{ needs.version-gate.outputs.version }}-${{ matrix.slug }}.mcpb `
            -Pack

      # Windows only, and only the pieces `wix build` actually needs. `dotnet` is
      # preinstalled on the runner; the two extensions are not optional — the
      # package uses the Firewall extension for the inbound rule and the UI
      # extension for the licence and finish dialogs.
      - name: Install the WiX toolchain
        if: matrix.coord == 'msi'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 6.0.2
          # GITHUB_PATH only affects LATER steps, so the two `wix` calls below
          # need PATH fixed in this shell as well as for the build step.
          $tools = "$env:USERPROFILE\.dotnet\tools"
          $env:PATH = "$tools;$env:PATH"
          $tools | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          wix extension add --global WixToolset.Firewall.wixext/6.0.2
          wix extension add --global WixToolset.UI.wixext/6.0.2
          wix --version

      - name: Build the coordinator MSI
        if: matrix.coord == 'msi'
        shell: pwsh
        run: |
          ./packaging/msi/build-msi.ps1 `
            -Version ${{ needs.version-gate.outputs.version }} `
            -CoordExe ./target/release/chapr-coord.exe `
            -Output ./dist/chapr-coord-${{ needs.version-gate.outputs.version }}-${{ matrix.slug }}.msi

      - name: Stage binaries
        shell: bash
        run: |
          set -euo pipefail
          v="${{ needs.version-gate.outputs.version }}"
          # The coordinator only where this platform ships one as a bare binary.
          # Windows ships the MSI built above instead; macOS ships none.
          if [ "${{ matrix.coord }}" = "binary" ]; then
            cp "target/release/chapr-coord${{ matrix.exe }}" \
               "dist/chapr-coord-$v-${{ matrix.slug }}${{ matrix.exe }}"
          fi
          # Both endpoint forms, on every platform. The `.mcpb` is a one-click
          # install for Claude Desktop — but `.mcpb` is *Desktop's* install format,
          # not a cross-vendor one, and the endpoint is a plain MCP stdio server
          # that any host can drive. Someone using the Claude Code CLI, or another
          # MCP client, needs a command to point at, which is what the bare binary
          # is for (`chapr-endpoint print-config <host>` prints the config).
          #
          # This was previously gated to non-Windows on the mistaken grounds that
          # Claude Desktop's Linux support was thin. It is not; the real
          # distinction is bundle-format versus bare command, which is orthogonal
          # to the OS. The gate meant a Windows user of any non-Desktop host had
          # nothing to download at all.
          cp "target/release/chapr-endpoint${{ matrix.exe }}" \
             "dist/chapr-endpoint-$v-${{ matrix.slug }}${{ matrix.exe }}"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.slug }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish (draft, on a tag)
    # Runs in BOTH modes on purpose. It used to be gated on `ref_type == 'tag'`,
    # which meant a dispatch run proved the build half of the pipeline and none of
    # the publish half — so the first real tag was also the first execution of
    # checksums, notes rendering, and `gh release create` at once. Now a dry run
    # does everything up to the irreversible step and uploads the result for
    # inspection, leaving exactly one never-yet-run command behind a tag.
    needs: [version-gate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # For provenance attestation.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: staged
          merge-multiple: true

      # Every artifact a user could download must be present and non-empty before
      # anything downstream treats the set as a release. A zero-byte binary
      # uploads cleanly, checksums cleanly, and fails only on the machine that
      # runs it — `if-no-files-found: error` catches an empty directory, not an
      # empty file.
      - name: Sanity-check the staged set
        shell: bash
        env:
          VERSION: ${{ needs.version-gate.outputs.version }}
        run: |
          set -euo pipefail
          cd staged
          ls -l

          # The set is named, not counted. A count says "8 things are here" and
          # is satisfied by eight wrong things — it cannot tell a missing MSI
          # from a stray file that took its place, which is a failure this
          # asymmetric set now makes possible. Name them, and a leg that silently
          # stopped producing its artifact fails here instead of shipping.
          # Stated here rather than derived from what the build produced: a check
          # that reads its expectations from the thing it is checking proves
          # nothing. The matrix and this list are meant to be maintained
          # independently — the check earns its keep precisely when they disagree.
          expected=(
            "chapr-coord-$VERSION-windows-x86_64.msi"
            "chaperone-endpoint-$VERSION-windows-x86_64.mcpb"
            "chapr-endpoint-$VERSION-windows-x86_64.exe"
            "chapr-coord-$VERSION-linux-x86_64"
            "chaperone-endpoint-$VERSION-linux-x86_64.mcpb"
            "chapr-endpoint-$VERSION-linux-x86_64"
            "chaperone-endpoint-$VERSION-macos-arm64.mcpb"
            "chapr-endpoint-$VERSION-macos-arm64"
          )

          bad=0
          # `-s` keeps the zero-byte coverage: an empty binary uploads cleanly,
          # checksums cleanly, and fails only on the machine that runs it.
          for f in "${expected[@]}"; do
            [ -s "$f" ] || { echo "::error::missing or empty artifact: $f"; bad=1; }
          done
          # And nothing else — an extra file is a rename nobody updated here, or
          # a leg producing something it should not.
          for f in *; do
            case " ${expected[*]} " in
              *" $f "*) ;;
              *) echo "::error::unexpected artifact staged: $f"; bad=1 ;;
            esac
          done

          [ "$bad" -eq 0 ] || exit 1
          echo "${#expected[@]} artifacts staged, all named and non-empty."

      # Attest BEFORE the checksum file exists, so the subjects are exactly the
      # things a user runs. Tag-only: attesting a dry run would mint provenance
      # for artifacts nobody can download. Attestations are free on public repos
      # and need Enterprise on private ones, hence the visibility check too — on a
      # private repo this skips, and releases go out unattested.
      - name: Provenance attestation
        if: github.ref_type == 'tag' && github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: staged/*

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd staged
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Release notes
        shell: bash
        env:
          VERSION: ${{ needs.version-gate.outputs.version }}
        run: |
          set -euo pipefail
          # On a dispatch, GITHUB_REF_NAME is a branch, so "from the main tag"
          # would be a lie in a file whose whole job is to be accurate.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            source_line="Built by GitHub Actions from the \`$GITHUB_REF_NAME\` tag."
          else
            source_line="Built by GitHub Actions from \`$GITHUB_REF_NAME\` as a dry run — this text was rendered, not published."
          fi
          cat > notes.md <<EOF
          Chaperone $VERSION — filesystem coordination for concurrent Claude agent sessions
          against a shared fileserver.

          ## Install

          **Coordinator** — one per site, on-prem beside the fileserver. Note throughout that
          \`addr\` (where the socket binds) and \`public_url\` (what a laptop connects to) are
          different settings.

          *Windows:* download \`chapr-coord-$VERSION-windows-x86_64.msi\` and run it. It places the
          binary, registers and starts the service, and opens the port. For a fleet:

          \`\`\`
          msiexec /i chapr-coord-$VERSION-windows-x86_64.msi COORD_SHARE=\\\\FS01\\Sales COORD_URL=http://FS01:8787 /qn
          \`\`\`

          A silent install prints nothing, so the values every laptop needs are written to
          \`handover.txt\` in the data directory; \`chapr-coord handover\` reprints them. The
          coordinator configures itself on its first start, and never touches a \`coord.toml\` that
          already exists — so an upgrade keeps your settings.

          *Linux:* download \`chapr-coord-$VERSION-linux-x86_64\` and run it with no arguments. The
          executable *is* the installer: a bare invocation runs the setup wizard, and \`serve\`
          takes over once a \`coord.toml\` exists.

          *macOS:* there is no coordinator build, deliberately. A Mac fronting a shared fileserver
          is a deployment nobody runs and nothing tests, and an artifact whose only claim is that
          it compiled is worse than an absent one. The macOS **endpoint** is unaffected.

          **Endpoint** — one per user machine. Two forms, same binary.

          *Claude Desktop:* download \`chaperone-endpoint-$VERSION-<os>.mcpb\` and double-click it
          (Settings → Extensions). It asks for the coordinator URL and the coordinated location;
          identity comes from the OS logon, so there is nothing else to set.

          *Any other MCP host:* download the bare \`chapr-endpoint-$VERSION-<os>\` binary. The
          endpoint is a standard MCP server over stdio configured entirely by environment
          variables, so anything speaking MCP can drive it — \`.mcpb\` is Claude Desktop's install
          format, not a requirement. The binary prints its own registration:

          \`\`\`sh
          chapr-endpoint print-config claude-code   # a \`claude mcp add …\` one-liner
          chapr-endpoint print-config generic       # the portable mcpServers JSON block
          \`\`\`

          The config goes to stdout alone, so \`print-config generic > .mcp.json\` is a usable file.
          Set \`CHAPR_COORD_URL\` and \`CHAPR_ROOT\` first and it prints your real values instead of
          placeholders.

          ## Verify

          \`\`\`sh
          sha256sum -c SHA256SUMS      # or: Get-FileHash on Windows
          \`\`\`

          ## Worth knowing

          - **Nothing here is code-signed — the MSI included.** Windows will show a SmartScreen
            prompt on the installer, and an administrator has to choose to continue past it. That
            is a deliberate open decision, not an oversight. The \`.mcpb\` bundles cannot be signed
            even in principle: signing is broken upstream in the mcpb CLI (\`node-forge\`: "PKCS#7
            signature verification not yet implemented"), so Claude Desktop reports every bundle as
            unsigned regardless. Accountability rests on the audit trail; managed fleets can
            pre-approve both via Intune/GPO. Verify what you downloaded with \`SHA256SUMS\`.
          - **Windows binaries link the CRT statically**, so no Visual C++ redistributable is
            needed — the trade is that CRT security fixes arrive with a Chaperone rebuild rather
            than via Windows Update.
          - **macOS is exercised on the POSIX path only.** CI runs the unit suite and the
            end-to-end job (coordinator + smoke suites + self-test) on macOS, so these artifacts
            are no longer build-only. But POSIX uses *advisory* \`flock\`: nothing covers a Mac
            driving an SMB share. Invariant 3 — the mandatory lock the write path rests on — is
            proven on Windows against a real SMB share, and nowhere else.
          - **Only Claude Desktop and Claude Code have been driven end to end.** The endpoint is a
            standard MCP server, so other hosts should work, and \`print-config generic\` emits the
            portable form — but "should" is not "does", and we do not test them.
          - **The coordinator's OS and the endpoints' OS are independent.** A Linux coordinator with
            Windows endpoints, or the reverse, is an ordinary deployment.
          - Every artifact carries LICENSE and NOTICE; the .mcpb bundles carry them inside.

          $source_line
          EOF
          cat notes.md

      # The one irreversible step, and so the only one still behind a tag.
      - name: Draft the release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --verify-tag \
            --title "Chaperone $GITHUB_REF_NAME" \
            --notes-file notes.md \
            staged/*
          echo "Draft release created — review and publish it from the Releases page."

      # A dry run's whole value is being inspectable, so hand back the two files
      # a tag would have published rather than only logging them.
      - name: Upload the dry-run release material
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-release-material
          path: |
            notes.md
            staged/SHA256SUMS
          if-no-files-found: error

      - name: Summary
        shell: bash
        env:
          VERSION: ${{ needs.version-gate.outputs.version }}
        run: |
          set -euo pipefail
          {
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "### Draft release $GITHUB_REF_NAME created"
              echo "Review and publish it from the Releases page."
            else
              echo "### Dry run for $VERSION — nothing published"
              echo "Checksums and release notes were produced and attached as"
              echo "\`dry-run-release-material\`. Everything a tag would do ran except"
              echo "\`gh release create\` and provenance attestation."
              echo ""
              echo "To release: bump \`[workspace.package] version\` in \`Cargo.toml\`,"
              echo "commit it, then \`git tag v<version> && git push origin v<version>\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
