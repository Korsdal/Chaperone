# Cut a release: push a `v*` tag, get built binaries and packed .mcpb bundles
# attached to a DRAFT GitHub Release for a human to review and publish.
#
# Anyone who clones this repo can build it themselves — `cargo build --release`
# is three words. Publishing binaries is not about capability, it is about not
# making a DBA install a Rust toolchain on a fileserver to try the thing.
#
# Deliberately absent: RUSTFLAGS. The env var REPLACES `target.*.rustflags` from
# .cargo/config.toml, which would drop `+crt-static` (D-032) and ship binaries
# that need the Visual C++ redistributable — the exact failure that cost hours at
# the first customer install.
name: Release

on:
  push:
    tags: ["v*"]
  # Dry run: builds and packs everything, uploads it as workflow artifacts, and
  # creates no release. Use it to prove the pipeline before spending a tag.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version-gate:
    name: Tag matches workspace version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: v
        shell: bash
        run: |
          set -euo pipefail
          workspace=$(sed -n 's/^version = "\([^"]*\)".*/\1/p' Cargo.toml | head -1)
          if [ -z "$workspace" ]; then echo "::error::could not read version from Cargo.toml"; exit 1; fi
          echo "version=$workspace" >> "$GITHUB_OUTPUT"

          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "Dry run for $workspace — every stage runs except the publish itself."
            exit 0
          fi

          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$workspace" ]; then
            echo "::error::tag v$tag does not match workspace version $workspace."
            echo "::error::Bump [workspace.package] version in Cargo.toml first, commit it, then tag."
            echo "::error::Versioning is a human responsibility in this project — CI will not paper over the mismatch."
            exit 1
          fi
          echo "Tag v$tag matches workspace version $workspace."

  build:
    name: ${{ matrix.slug }}
    needs: version-gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            slug: windows-x86_64
            exe: ".exe"
          - os: ubuntu-latest
            platform: linux
            slug: linux-x86_64
            exe: ""
          # Built, never run. Nothing in the endpoint is Linux-specific — there is
          # no `cfg(target_os)`, `cfg(unix)` or `libc` use anywhere in it, so the
          # split is Windows vs not-Windows and macOS takes the same POSIX path.
          # That makes it cheap to build and still unexercised, which the release
          # notes say out loud rather than letting a green artifact imply testing.
          - os: macos-latest
            platform: darwin
            slug: macos-arm64
            exe: ""
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # For `npx @anthropic-ai/mcpb` in the packing step.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # A release build that has not passed its own tests is not a release. This
      # duplicates CI on purpose: a tag can be pushed at a commit CI never saw.
      - name: Test
        run: cargo test --workspace

      - name: Build release binaries
        run: cargo build --release --workspace

      - name: Prepare dist
        shell: bash
        run: mkdir -p dist

      # One bundle per client OS, built ON that OS — build-mcpb.ps1 refuses to
      # label a binary as a platform it was not compiled for.
      - name: Pack the endpoint MCPB
        shell: pwsh
        run: |
          ./packaging/mcpb/build-mcpb.ps1 `
            -Template ./packaging/mcpb/manifest.template.json `
            -Version ${{ needs.version-gate.outputs.version }} `
            -Platform ${{ matrix.platform }} `
            -OutDir ./build/bundle `
            -Output ./dist/chaperone-endpoint-${{ needs.version-gate.outputs.version }}-${{ matrix.slug }}.mcpb `
            -Pack

      - name: Stage binaries
        shell: bash
        run: |
          set -euo pipefail
          v="${{ needs.version-gate.outputs.version }}"
          cp "target/release/chapr-coord${{ matrix.exe }}" \
             "dist/chapr-coord-$v-${{ matrix.slug }}${{ matrix.exe }}"
          # Both endpoint forms, on every platform. The `.mcpb` is a one-click
          # install for Claude Desktop — but `.mcpb` is *Desktop's* install format,
          # not a cross-vendor one, and the endpoint is a plain MCP stdio server
          # that any host can drive. Someone using the Claude Code CLI, or another
          # MCP client, needs a command to point at, which is what the bare binary
          # is for (`chapr-endpoint print-config <host>` prints the config).
          #
          # This was previously gated to non-Windows on the mistaken grounds that
          # Claude Desktop's Linux support was thin. It is not; the real
          # distinction is bundle-format versus bare command, which is orthogonal
          # to the OS. The gate meant a Windows user of any non-Desktop host had
          # nothing to download at all.
          cp "target/release/chapr-endpoint${{ matrix.exe }}" \
             "dist/chapr-endpoint-$v-${{ matrix.slug }}${{ matrix.exe }}"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.slug }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish (draft, on a tag)
    # Runs in BOTH modes on purpose. It used to be gated on `ref_type == 'tag'`,
    # which meant a dispatch run proved the build half of the pipeline and none of
    # the publish half — so the first real tag was also the first execution of
    # checksums, notes rendering, and `gh release create` at once. Now a dry run
    # does everything up to the irreversible step and uploads the result for
    # inspection, leaving exactly one never-yet-run command behind a tag.
    needs: [version-gate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # For provenance attestation.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: staged
          merge-multiple: true

      # Every artifact a user could download must be present and non-empty before
      # anything downstream treats the set as a release. A zero-byte binary
      # uploads cleanly, checksums cleanly, and fails only on the machine that
      # runs it — `if-no-files-found: error` catches an empty directory, not an
      # empty file.
      - name: Sanity-check the staged set
        shell: bash
        run: |
          set -euo pipefail
          cd staged
          ls -l
          n=0
          for f in *; do
            [ -s "$f" ] || { echo "::error::$f is empty"; exit 1; }
            n=$((n+1))
          done
          echo "$n artifacts staged"
          # 3 platforms x (coord + .mcpb bundle + bare endpoint binary).
          [ "$n" -eq 9 ] || { echo "::error::expected 9 artifacts, staged $n"; exit 1; }

      # Attest BEFORE the checksum file exists, so the subjects are exactly the
      # things a user runs. Tag-only: attesting a dry run would mint provenance
      # for artifacts nobody can download. Attestations are free on public repos
      # and need Enterprise on private ones, hence the visibility check too — on a
      # private repo this skips, and releases go out unattested.
      - name: Provenance attestation
        if: github.ref_type == 'tag' && github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: staged/*

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd staged
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Release notes
        shell: bash
        env:
          VERSION: ${{ needs.version-gate.outputs.version }}
        run: |
          set -euo pipefail
          # On a dispatch, GITHUB_REF_NAME is a branch, so "from the main tag"
          # would be a lie in a file whose whole job is to be accurate.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            source_line="Built by GitHub Actions from the \`$GITHUB_REF_NAME\` tag."
          else
            source_line="Built by GitHub Actions from \`$GITHUB_REF_NAME\` as a dry run — this text was rendered, not published."
          fi
          cat > notes.md <<EOF
          Chaperone $VERSION — filesystem coordination for concurrent Claude agent sessions
          against a shared fileserver.

          ## Install

          **Coordinator** — one per site, on-prem beside the fileserver.

          Download \`chapr-coord-$VERSION-windows-x86_64.exe\` (or the Linux build) and run it
          with no arguments. The executable *is* the installer: a bare invocation runs the setup
          wizard, and \`serve\` takes over once a \`coord.toml\` exists. Note that \`addr\` (where
          the socket binds) and \`public_url\` (what a laptop connects to) are different settings.

          **Endpoint** — one per user machine. Two forms, same binary.

          *Claude Desktop:* download \`chaperone-endpoint-$VERSION-<os>.mcpb\` and double-click it
          (Settings → Extensions). It asks for the coordinator URL and the coordinated location;
          identity comes from the OS logon, so there is nothing else to set.

          *Any other MCP host:* download the bare \`chapr-endpoint-$VERSION-<os>\` binary. The
          endpoint is a standard MCP server over stdio configured entirely by environment
          variables, so anything speaking MCP can drive it — \`.mcpb\` is Claude Desktop's install
          format, not a requirement. The binary prints its own registration:

          \`\`\`sh
          chapr-endpoint print-config claude-code   # a \`claude mcp add …\` one-liner
          chapr-endpoint print-config generic       # the portable mcpServers JSON block
          \`\`\`

          The config goes to stdout alone, so \`print-config generic > .mcp.json\` is a usable file.
          Set \`CHAPR_COORD_URL\` and \`CHAPR_ROOT\` first and it prints your real values instead of
          placeholders.

          ## Verify

          \`\`\`sh
          sha256sum -c SHA256SUMS      # or: Get-FileHash on Windows
          \`\`\`

          ## Worth knowing

          - **The .mcpb bundles are unsigned.** Signing is broken upstream in the mcpb CLI
            (\`node-forge\`: "PKCS#7 signature verification not yet implemented"), so Claude Desktop
            reports every bundle as unsigned regardless. Accountability rests on the audit trail;
            managed fleets can pre-approve the bundle via Intune/GPO.
          - **Windows binaries link the CRT statically**, so no Visual C++ redistributable is
            needed — the trade is that CRT security fixes arrive with a Chaperone rebuild rather
            than via Windows Update.
          - **The macOS artifacts are built, not exercised.** Nothing in the endpoint is
            Linux-specific, so macOS takes the same POSIX path Linux does and compiles cleanly —
            but no one has run it there. Treat it as untested rather than supported.
          - **Only Claude Desktop and Claude Code have been driven end to end.** The endpoint is a
            standard MCP server, so other hosts should work, and \`print-config generic\` emits the
            portable form — but "should" is not "does", and we do not test them.
          - **The coordinator's OS and the endpoints' OS are independent.** A Linux coordinator with
            Windows endpoints, or the reverse, is an ordinary deployment.
          - Every artifact carries LICENSE and NOTICE; the .mcpb bundles carry them inside.

          $source_line
          EOF
          cat notes.md

      # The one irreversible step, and so the only one still behind a tag.
      - name: Draft the release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --verify-tag \
            --title "Chaperone $GITHUB_REF_NAME" \
            --notes-file notes.md \
            staged/*
          echo "Draft release created — review and publish it from the Releases page."

      # A dry run's whole value is being inspectable, so hand back the two files
      # a tag would have published rather than only logging them.
      - name: Upload the dry-run release material
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-release-material
          path: |
            notes.md
            staged/SHA256SUMS
          if-no-files-found: error

      - name: Summary
        shell: bash
        env:
          VERSION: ${{ needs.version-gate.outputs.version }}
        run: |
          set -euo pipefail
          {
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "### Draft release $GITHUB_REF_NAME created"
              echo "Review and publish it from the Releases page."
            else
              echo "### Dry run for $VERSION — nothing published"
              echo "Checksums and release notes were produced and attached as"
              echo "\`dry-run-release-material\`. Everything a tag would do ran except"
              echo "\`gh release create\` and provenance attestation."
              echo ""
              echo "To release: bump \`[workspace.package] version\` in \`Cargo.toml\`,"
              echo "commit it, then \`git tag v<version> && git push origin v<version>\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
