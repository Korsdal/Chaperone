# Chaperone — Cargo workspace root.
#
# Filesystem coordination for concurrent Claude Desktop agent sessions against a
# single on-prem SMB fileserver. See README.md for the settled architecture.
#
# Build order (implementation notes §3–4): chapr-proto -> chapr-coord -> chapr-endpoint.
# Only chapr-proto exists today (backlog E-001). chapr-coord (E-002) and
# chapr-endpoint (E-005) join this member list when they are built.

[workspace]
resolver = "2"
members = [
    "crates/chapr-proto",
    "crates/chapr-coord",       # E-002 — axum + sqlx coordination service
    "crates/chapr-endpoint",    # E-005 — coord client + canonicaliser (rmcp/windows-rs later slices)
]

# Shared package metadata. Every crate inherits these with `x.workspace = true`
# so version/edition/license are defined once and cannot drift between binaries.
[workspace.package]
version = "0.1.0"          # baseline set by jok 2026-07-21; human owns version bumps (see README)
edition = "2021"
# 1.88.0 is the highest rust-version declared anywhere in the LOCKED dependency
# graph: darling 0.23 and time 0.3.55 require it, with the icu_* 2.2 crates just
# below at 1.86. This number has now been wrong twice — it claimed 1.75 while the
# tree needed 1.85, then 1.85 while the tree needed 1.88 — both times because it
# was reasoned about from a couple of direct dependencies instead of measured
# across the graph. Derive it, don't estimate it:
#
#   cargo metadata --format-version 1 | <take the max .packages[].rust_version>
#
# CI's `msrv` job reads this exact field and builds with that toolchain, so the
# declaration cannot silently drift from what compiles again.
rust-version = "1.88.0"
# Apache-2.0 as of 2026-08-19 (D-033). Full text in LICENSE at the repo root;
# per-company attribution is in NOTICE, which section 4(d) of the licence requires
# a redistributor to carry along.
license = "Apache-2.0"
# Still not on crates.io: these are two deployables, not libraries. Open source
# and published-to-a-registry are separate decisions.
publish = false

# Single source of truth for dependency versions across all three crates.
# Members reference these with `dep.workspace = true`, so chapr-coord and
# chapr-endpoint cannot pull a different serde/blake3 than chapr-proto.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
# Added for chapr-coord (E-002). tokio is shared with chapr-endpoint (E-005).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
axum = "0.8"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Added for chapr-endpoint (E-005). `rustls-tls` (E-016) lets it reach an HTTPS
# coord; Negotiate/Kerberos on top is still deferred (E-015).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
unicode-normalization = "0.1"
rmcp = { version = "2.2", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1"
# Binary content at the MCP boundary: a read of non-UTF-8 bytes is base64'd
# rather than lossily transcoded, and a write can carry base64 back.
base64 = "0.22"
# Named directly by chapr-coord so it can pick a crypto provider explicitly. A
# workspace build unifies rustls' `aws-lc-rs` (via axum-server) with `ring` (via
# reqwest), and rustls then refuses to guess — see chapr-coord/src/main.rs.
rustls = { version = "0.23", features = ["aws-lc-rs"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_IO",
    # E-022: WNetGetUniversalNameW, to resolve a mapped drive letter to the UNC
    # name of the share it points at (invariant 5 — see `mount.rs`).
    "Win32_NetworkManagement_WNet",
] }

[profile.release]
# The endpoint ships as a single static binary to managed laptops (notes §7).
# Optimise for size/robustness over raw speed — this system is network-bound.
opt-level = 2
lto = "thin"
