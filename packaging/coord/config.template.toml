# Chaperone coordinator — configuration TEMPLATE.
# Precedence: built-in defaults < this file < environment (CHAPR_COORD_*).
# Generate interactively with `chapr-coord setup`, or copy + edit this file and
# run `chapr-coord serve --config coord.toml`.

# This coordinator's own home: the admin token, the endpoint token and the TLS
# material live here, and the database and blob store default under it. Set this
# and the three below can be left out entirely.
#
# It is explicit rather than derived. It used to be inferred from db_url's parent,
# which meant a db_url missing its `sqlite:` prefix produced a coordinator with
# neither token — running, serving, and answering 503 on every admin route.
data_dir = "C:/ProgramData/Chaperone"

# SQLite database (operational state: leases, index, journal, conflicts, audit).
# Put it on a persistent, backed-up volume. Defaults to coord.db under data_dir;
# set it only to put the database somewhere else. It MUST start with `sqlite:`
# and use forward slashes, on Windows too — coord refuses to start otherwise.
db_url = "sqlite:C:/ProgramData/Chaperone/coord.db?mode=rwc"

# Listen address — where the SOCKET BINDS. 0.0.0.0 for a LAN-reachable service,
# 127.0.0.1 for loopback only. This is not a URL and must never be given to a user.
addr = "0.0.0.0:8787"

# The URL the laptops connect to. THIS is the value that goes in every endpoint's
# configuration, and it is deliberately separate from `addr` above: `0.0.0.0` and
# `127.0.0.1` are correct bind addresses and useless URLs. Leave it out and coord
# derives it from this machine's hostname plus `addr`'s port, which is usually right.
# Coord refuses to start with a loopback URL while `addr` listens for other machines.
# Note the scheme: https, to match the [tls] section below.
public_url = "https://FILESERVER:8787"

# Content-addressed history/blob store. A SEPARATE mount from the DB is
# recommended (it grows with write volume). Back both up together.
blob_root = "C:/ProgramData/Chaperone/blobs"

# Control-channel auth (the pluggable Authenticator boundary):
#   shared-secret   RECOMMENDED. Endpoints must present this deployment's token,
#                   AND name a principal. The token is created automatically on
#                   first start, in the data directory beside the database, as
#                   `endpoint-token`; coord logs the path. Give that value to every
#                   laptop as CHAPR_COORD_TOKEN (a packager can bake it into the
#                   .mcpb so users type nothing). It proves a caller is one of your
#                   endpoints; it does NOT make the acting user verified — that is
#                   E-015.
#   trusted-header  Accepts ANY non-empty X-Chapr-Principal from ANYONE who can
#                   reach this port. Attribution, not authentication. Only for a
#                   network where that is already acceptable.
#   disabled        no auth at all — loopback/dev only.
#   negotiate|oidc  enforced hardening paths (deferred, E-015).
#
# Changing this on a LIVE deployment is a cutover, not a switch: set the new mode
# here, keep the old one as auth_fallback below, watch the Settings tab until
# nothing arrives on the fallback, then remove it (D-031).
auth = "shared-secret"

# The old mode, kept reachable during a cutover. Remove it once the Settings tab
# shows no fallback use AND no rejections.
# auth_fallback = "trusted-header"

# The fileserver backend coord ANNOUNCES to endpoints (they confirm it locally).
# smb | posix.
backend = "smb"

# Background job intervals (seconds). Defaults are fine for ~20 users.
reap_secs = 30      # lease reaper
gc_secs   = 86400   # blob GC (daily)

# The share this coordinator fronts, as UNC. Set by the wizard, which offers the
# machine's own shares. It is what the handover tells the administrator to give
# users, and the canonical prefix coordination state is keyed by (invariant 5) —
# so a hidden share keeps its `$`, and a drive letter is refused here.
share_unc = "\\\\FILESERVER\\Share"

# --- Optional: change-watcher (invalidates the cache on out-of-band edits) ---
# A local path an OS thread reads; usually the same as `share_unc`, but a distinct
# setting because they are distinct things.
# watch_dir  = "\\\\fileserver\\share"

# --- TLS on the control channel. ON by default; opting out is a real decision. ---
# The control channel carries the principal header that stamps the audit trail and
# the pre-image bytes of every write. Over plain HTTP all of it is readable on the
# wire, and any credential on it is theatre.
#
# The easy path is `chapr-coord setup`, which generates a self-signed pair, writes
# these paths, and sets public_url to https for you. Use this template instead when
# you are supplying your own PEM pair from your CA — point the two paths at it.
#
# Coord refuses to start if either file is missing, and says which one.
#
# To serve plaintext anyway: delete these three lines AND change public_url above
# back to http://. Coord refuses to start on a mismatch — an https URL served over
# plain HTTP is a value that looks right and connects to nothing. It will also log a
# warning at every start, which is deliberate and is not a bug to be silenced.
[tls]
cert_path = "C:/ProgramData/Chaperone/tls/coord.crt"
key_path  = "C:/ProgramData/Chaperone/tls/coord.key"

# --- Optional: mixed-backend routing (longest-prefix wins; else `backend`) ---
# [[backend_routes]]
# prefix = "\\\\fileserver\\share\\cloud"
# kind   = "posix"
