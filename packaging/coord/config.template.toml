# Chaperone coordinator — configuration TEMPLATE.
# Precedence: built-in defaults < this file < environment (CHAPR_COORD_*).
# Generate interactively with `chapr-coord setup`, or copy + edit this file and
# run `chapr-coord serve --config coord.toml`.

# SQLite database (operational state: leases, index, journal, conflicts, audit).
# Put it on a persistent, backed-up volume.
db_url = "sqlite:C:/ProgramData/Chaperone/coord.db?mode=rwc"

# Listen address — where the SOCKET BINDS. 0.0.0.0 for a LAN-reachable service,
# 127.0.0.1 for loopback only. This is not a URL and must never be given to a user.
addr = "0.0.0.0:8787"

# The URL the laptops connect to. THIS is the value that goes in every endpoint's
# configuration, and it is deliberately separate from `addr` above: `0.0.0.0` and
# `127.0.0.1` are correct bind addresses and useless URLs. Leave it out and coord
# derives it from this machine's hostname plus `addr`'s port, which is usually right.
# Coord refuses to start with a loopback URL while `addr` listens for other machines.
public_url = "http://FILESERVER:8787"

# Content-addressed history/blob store. A SEPARATE mount from the DB is
# recommended (it grows with write volume). Back both up together.
blob_root = "C:/ProgramData/Chaperone/blobs"

# Control-channel auth (the pluggable Authenticator boundary):
#   trusted-header  MVP: endpoint asserts the logged-in OS identity (accountability,
#                   not spoof-proof — concept §13.1). The recommended default.
#   disabled        no auth — loopback/dev only.
#   negotiate|oidc  enforced hardening paths (deferred, E-015).
auth = "trusted-header"

# The fileserver backend coord ANNOUNCES to endpoints (they confirm it locally).
# smb | posix.
backend = "smb"

# Background job intervals (seconds). Defaults are fine for ~20 users.
reap_secs = 30      # lease reaper
gc_secs   = 86400   # blob GC (daily)

# The share this coordinator fronts, as UNC. Set by the wizard, which offers the
# machine's own shares. It is what the handover tells the administrator to give
# users, and the canonical prefix coordination state is keyed by (invariant 5) —
# so a hidden share keeps its `$`, and a drive letter is refused here.
share_unc = "\\\\FILESERVER\\Share"

# --- Optional: change-watcher (invalidates the cache on out-of-band edits) ---
# A local path an OS thread reads; usually the same as `share_unc`, but a distinct
# setting because they are distinct things.
# watch_dir  = "\\\\fileserver\\share"

# --- Optional: TLS (serve HTTPS on the control channel) ---
# [tls]
# cert_path = "C:/ProgramData/Chaperone/tls/coord.crt"
# key_path  = "C:/ProgramData/Chaperone/tls/coord.key"

# --- Optional: mixed-backend routing (longest-prefix wins; else `backend`) ---
# [[backend_routes]]
# prefix = "\\\\fileserver\\share\\cloud"
# kind   = "posix"
