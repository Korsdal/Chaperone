# chapr-endpoint — the local MCP server (one per sales laptop).
#
# stdio child of Claude Desktop; does SMB I/O as the logged-in user and owns the
# exclusive-open write path, CAS, read state machine, and lease-renewal thread.
# Built LAST (implementation notes §4), once the protocol and coord are proven.
#
# E-005 slice 1 (foundation): this crate is a *library* for now — the coord HTTP
# client and the path canonicaliser, both fully testable without Win32 or MCP.
# The rmcp stdio server (the `[[bin]]`), the windows-rs write path, and the
# lease-renewal thread land in later slices.

[package]
name = "chapr-endpoint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
chapr-proto = { path = "../chapr-proto" }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tokio.workspace = true
reqwest.workspace = true
unicode-normalization.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rmcp.workspace = true
schemars.workspace = true
# Binary content at the MCP boundary — a read of non-UTF-8 bytes comes back
# base64 rather than lossily transcoded through from_utf8_lossy.
base64.workspace = true
# Uniqueness suffix on conflict-sidecar / restore-copy names: a second-granular
# timestamp alone collides when two conflicts land in the same second.
uuid.workspace = true
# POSIX backend (E-019): portable advisory file locks. Advisory on Unix (flock),
# mandatory on Windows (LockFileEx) — see the D-C caveat.
fs4 = "1.1"
# SMB backend: CreateFileW/MoveFileExW/ReadDirectoryChangesW. Windows-only, so
# gated — the POSIX backend keeps the crate buildable on Linux (E-019 D-C).
[target.'cfg(windows)'.dependencies]
windows.workspace = true

[dev-dependencies]
# Mock coord for exercising the HTTP client without a live server.
wiremock = "0.6"
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
# Real files under a throwaway dir, so the MCP round-trip tests drive the actual
# POSIX backend (exclusive open, CAS re-hash, in-place overwrite) rather than a
# mock that would skip exactly the code the corruption bug lived next to.
tempfile = "3"
